# tvbox safe mode: keep the TV session down.
# Installed as /etc/systemd/system/greetd.service.d/10-tvbox-safemode.conf.
#
# greetd is what autologins into the compositor and so into the tvbox shell, so
# stopping it is the whole of safe mode on the session side: networking, sshd and
# the diagnostics units are untouched. A failed condition makes systemd skip the
# unit rather than fail it, so greetd's Restart=always does not fight this.
#
# /run is a tmpfs, so the flag - and safe mode with it - cannot survive a reboot.
[Unit]
ConditionPathExists=!/run/tvbox-safe-mode
