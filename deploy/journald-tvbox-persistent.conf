# tvbox: keep the journal across a reboot, so a box that died leaves a trace.
# Installed as /etc/systemd/journald.conf.d/50-tvbox-persistent.conf.
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# with Storage=volatile, which keeps the journal in /run to spare the SD card. The
# cost is that a box which crashed, respawned in a loop or engaged safe mode has
# nothing to show for it once it has been restarted - the account of what happened
# was in a tmpfs, and restarting it is the first thing anyone does. A drop-in under
# /etc wins over the one under /usr/lib.
#
# The wear is bounded rather than trusted: a TV box writes little, and what it does
# write is capped here. 20 MB per file so a rotation is cheap.
#
# One failure this does NOT catch, and it is worth knowing which: the card itself.
# The writes stop landing at exactly the moment there is something to record, so
# the kernel's own account of a dying SD card is lost with everything else. That
# one is reported live instead (shell/storagehealth.js - on screen, and retained
# over MQTT), because it has to leave the box rather than reach the disk.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
