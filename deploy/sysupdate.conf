# tvbox-sysupdate - the ROOT half of an update reads its settings from here, and
# never from ~/.tvbox/config.json.
#
# That separation is the point. The box user may set `update.feed` in their own
# config (plain http to a LAN host is allowed there, for a self-hosted test
# loop), and they can also point the box's DNS wherever they like - the
# NetworkManager polkit grant covers group netdev. If root took its feed from
# either, the box user would choose where root downloads the code it runs.
#
# Installed to /etc/tvbox/sysupdate.conf by provision.sh and by the SD image,
# and only when it is not already there: an operator who pointed a box at their
# own feed keeps that across updates.

# Where the signed feed lives. https anywhere, or plain http ONLY to a literal
# private address (10/8, 172.16/12, 192.168/16, 127/8) - a NAME over http would
# be resolved by a resolver the box user controls. Keep in step with
# DEFAULT_FEED in shell/updater.js; updater.test.js checks that they match.
FEED_URL=https://github.com/Andy1210/tvbox/releases/latest/download/update.json

# The account provision.sh grants things to (groups, lingering, the sudoers
# line). Written by provision.sh / the image build - it is pinned rather than
# discovered because "whichever home has a .tvbox in it" would let directory
# order decide who gets those grants.
TVBOX_USER=
