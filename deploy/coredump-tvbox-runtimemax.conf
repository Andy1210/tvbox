# tvbox: bound how long a core dump may hold the box.
# Installed as /etc/systemd/system/systemd-coredump@.service.d/10-tvbox-runtime-max.conf.
#
# The kernel pipes a crashing process's core into this service, so the session
# stalls on IO for as long as it runs - on an SD card that is the whole box, not
# just the app that died. systemd's own limit is 5 minutes, which on a TV reads
# as a hang. When this one hits, systemd stops the service, the kernel's write
# gets EPIPE and the rest of the dump is abandoned.
#
# This is the ceiling, not the mechanism: session.sh sets a coredump_filter that
# keeps real dumps to well under a second. A dump that needs longer than this is
# one worth losing.
[Service]
RuntimeMaxSec=20s
