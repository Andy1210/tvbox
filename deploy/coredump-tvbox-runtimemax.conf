# tvbox: bound how long a core dump may hold the box.
# Installed as /etc/systemd/system/systemd-coredump@.service.d/10-tvbox-runtime-max.conf.
#
# The kernel pipes a crashing process's core into this service, so the session
# stalls on IO for as long as it runs - on an SD card that is the whole box, not
# just the app that died. A pipe cannot skip a hole, so a process with a large
# sparse address space costs its whole VIRTUAL size in zeroes however little is
# resident: an emulator's fastmem arena measured 65 GB against 475 MB resident.
# systemd's own limit is 5 minutes, which on a TV reads as a hang.
#
# This is what actually bounds the freeze. When it hits, systemd stops the
# service, the kernel's write gets EPIPE and the rest of the dump is abandoned,
# so a dump that needs longer than this is lost. Deliberate: on a TV a bounded
# pause beats a core nobody was waiting for.
#
# To capture one on purpose, point core_pattern at a plain FILE for the run
# (holes become sparse and cost nothing) rather than raising this. The path is
# resolved in the crashing process's mount namespace, so for a flatpak app it has
# to be one the sandbox shares - under the box user's home, not /var/tmp.
[Service]
RuntimeMaxSec=20s
