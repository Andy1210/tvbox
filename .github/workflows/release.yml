# tvbox OTA release - on a v* tag: pack the shell release tarball + update.json
# feed (scripts/make-release.sh), attach both to the GitHub Release, then kick
# off the SD-image build for the same tag (it attaches the .img.xz when done,
# ~1.5 h later). Boxes poll releases/latest/download/update.json
# (shell/updater.js), so publishing the release IS the rollout.
#
# Flow: bump shell/package.json "version", add a CHANGELOG.md section, commit,
# tag v<version>, push the tag. Everything else is automatic.
#
# The explicit workflow-dispatch at the end is load-bearing: a release created
# with GITHUB_TOKEN does NOT fire other workflows' `on: release` triggers
# (GitHub's recursion guard), so sd-image.yml must be dispatched by hand here.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload assets
  actions: write # dispatch the sd-image workflow

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: launcher/package-lock.json }

      - name: tag must match shell/package.json version
        run: |
          V="$(node -p "require('./shell/package.json').version")"
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != shell version v$V"; exit 1; }

      - name: build launcher
        run: cd launcher && npm ci --no-audit --no-fund && npm run build

      - name: pack release (tarball + signed update.json)
        # The signature is what lets a box run the release's ROOT half
        # (tvbox-sysupdate verifies the feed against a key pinned in /etc). Without
        # the secret the release still packs and boxes still take the shell - they
        # just refuse the root half, which is a feature that stays off rather than
        # a broken release. The key file is written under RUNNER_TEMP and the step
        # deletes it, so it never lands in the workspace or an artifact.
        env: { TVBOX_RELEASE_KEY: "${{ secrets.TVBOX_RELEASE_KEY }}" }
        run: |
          if [ -n "$TVBOX_RELEASE_KEY" ]; then
            KEY="$RUNNER_TEMP/release-key.pem"
            umask 077
            printf '%s\n' "$TVBOX_RELEASE_KEY" > "$KEY"
            trap 'rm -f "$KEY"' EXIT
            ./scripts/make-release.sh --skip-build --out dist --sign-key "$KEY"
          else
            echo "::warning::TVBOX_RELEASE_KEY is not set - publishing an UNSIGNED feed; boxes will refuse system updates from it"
            ./scripts/make-release.sh --skip-build --out dist
          fi

      - name: create GitHub release with the OTA assets
        env: { GH_TOKEN: "${{ github.token }}" }
        # idempotent: a re-run / re-pushed tag refreshes the assets instead of
        # dying on "release already exists". The release body is the CHANGELOG's
        # English notes + a full-changelog compare link (matching earlier
        # releases), NOT GitHub's --generate-notes PR-list / "New Contributors".
        run: |
          # previous version = the 2nd "## x.y.z" header in CHANGELOG.md
          PREV="$(grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -n '2p' | awk '{print $2}')"
          export COMPARE=""
          [ -n "$PREV" ] && export COMPARE="https://github.com/${{ github.repository }}/compare/v${PREV}...${GITHUB_REF_NAME}"
          node -e '
            const n = require("./dist/update.json").notes || {};
            let body = n.en || "See CHANGELOG.md.";
            if (process.env.COMPARE) body += "\n\n**Full changelog:** " + process.env.COMPARE;
            require("fs").writeFileSync("dist/RELEASE_NOTES.md", body + "\n");
          '
          # update.json and its .sig go up TOGETHER, in one invocation and with a
          # glob that covers both: a re-run that refreshed the feed but left the
          # old signature beside it would look exactly like a tampered feed, and
          # every box in the field would refuse system updates until someone
          # noticed. The feed carries a publishedAt, so its bytes differ on every
          # run - the pair is never interchangeable across runs.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file dist/RELEASE_NOTES.md
            gh release upload "${GITHUB_REF_NAME}" dist/tvbox-shell-*.tar.gz dist/update.json* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/tvbox-shell-*.tar.gz dist/update.json* \
              --title "tvbox ${GITHUB_REF_NAME}" --notes-file dist/RELEASE_NOTES.md
          fi

      - name: kick off the SD-image build for this release
        env: { GH_TOKEN: "${{ github.token }}" }
        # NB: gh wants the workflow FILE name (image.yml), not its `name:`
        run: gh workflow run image.yml --ref "${GITHUB_REF_NAME}" -f release-tag="${GITHUB_REF_NAME}"
