<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0f14" />
    <title>tvbox remote</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: #0b0f14;
        color: #f4f6fa;
        font:
          16px/1.4 system-ui,
          sans-serif;
        /* A remote is held, not read: nothing here should select or scroll. */
        user-select: none;
        overscroll-behavior: none;
        touch-action: manipulation;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      }
      .hint {
        color: #7d8a99;
        font-size: 13px;
        text-align: center;
        min-height: 18px;
      }
      .hint.bad {
        color: #ff9a9a;
      }
      button {
        font: inherit;
        color: inherit;
        background: #171f29;
        border: 0;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button:active {
        background: #2b3746;
        transform: scale(0.97);
      }
      /* The pad is one grid so the arrows keep their positions on any phone. */
      #pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: min(86vw, 320px);
        aspect-ratio: 1;
      }
      #pad button {
        font-size: 26px;
      }
      #pad .ok {
        font-size: 17px;
        font-weight: 700;
        background: #1f6feb;
        border-radius: 50%;
      }
      #pad .ok:active {
        background: #3b83f0;
      }
      .row {
        display: flex;
        gap: 10px;
        width: min(86vw, 320px);
      }
      .row button {
        flex: 1;
        height: 54px;
        font-size: 15px;
        font-weight: 600;
      }
      .row.small button {
        height: 46px;
        font-size: 14px;
        color: #aab4c2;
      }
      /* The screen view. Only ever appears when the TV is sharing it, so its
         absence is the honest signal that nothing is being watched. */
      #screen {
        width: min(86vw, 320px);
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      /* The frame is the ONE thing here that zooms. The page itself must not:
         a D-pad that pinches when a thumb slips is worse than no zoom at all,
         which is why the viewport stays user-scalable=no and the gesture is
         handled here instead. touch-action:none is what stops the browser
         claiming the pinch before this code sees it. */
      #frame {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #171f29;
        aspect-ratio: 16 / 9;
        touch-action: none;
      }
      #screen img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        transform-origin: 0 0;
        will-change: transform;
      }
      #screen .cap {
        font-size: 12px;
        color: #7d8a99;
        text-align: center;
      }
      #setup {
        width: min(86vw, 320px);
        display: none;
        flex-direction: column;
        gap: 12px;
      }
      #setup input {
        font: inherit;
        color: inherit;
        background: #171f29;
        border: 1px solid #26313d;
        border-radius: 12px;
        padding: 14px;
        width: 100%;
      }
      #setup button {
        height: 52px;
        background: #1f6feb;
        font-weight: 700;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        text-align: center;
      }
      #main {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
    </style>
  </head>
  <body>
    <div id="setup">
      <h1>Pair this phone</h1>
      <p class="hint">Enter the four digits shown on the TV.</p>
      <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off" />
      <input id="name" maxlength="40" placeholder="This phone" autocomplete="off" />
      <button id="pair">Pair</button>
      <p class="hint" id="setup-msg"></p>
    </div>

    <div id="main">
      <div id="pad">
        <span></span>
        <button data-key="up">▲</button>
        <span></span>
        <button data-key="left">◀</button>
        <button class="ok" data-key="ok">OK</button>
        <button data-key="right">▶</button>
        <span></span>
        <button data-key="down">▼</button>
        <span></span>
      </div>
      <div class="row">
        <button data-key="back">Back</button>
        <button data-key="home">Home</button>
        <button data-key="playpause">Play</button>
      </div>
      <div class="row">
        <button data-key="volume_down">Vol −</button>
        <button data-key="mute">Mute</button>
        <button data-key="volume_up">Vol +</button>
      </div>
      <div class="row small">
        <button data-key="rewind">◀◀</button>
        <button data-key="settings">Settings</button>
        <button data-key="fastforward">▶▶</button>
      </div>
      <div id="screen">
        <div id="frame"><img id="shot" alt="" /></div>
        <div class="cap" id="shotcap"></div>
      </div>
      <p class="hint" id="msg"></p>
    </div>

    <script src="/tvbox-seal.js" data-v="2"></script>
    <script>
      // The key is this phone's, and it is the only thing that gets it in. It
      // lives in localStorage so the page is a bookmark rather than a pairing
      // ceremony every time - which is the whole point of adopting a phone
      // instead of running a session. It never crosses the network after the
      // adoption: every request is signed with it (tvboxSeal.lib).
      var KEY = "tvbox-remote-v2";
      var lib = tvboxSeal.lib;
      var me = null; // { id, key: Uint8Array, skew }
      var retired = false;
      try {
        var saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved && saved.id && lib.key(saved.key))
          me = { id: saved.id, key: lib.key(saved.key), skew: saved.skew || 0, raw: saved.key };
        // A phone paired before requests were signed holds a bare token, which the
        // box no longer accepts: it pairs again.
        if (localStorage.getItem("tvbox-remote-token")) {
          localStorage.removeItem("tvbox-remote-token");
          retired = !me;
        }
      } catch (e) {}
      // The one-time key and the code came in the fragment. Read, then taken out of
      // the address bar, so a bookmark or a shared link does not carry them.
      var oneTime = null;
      var fromQr = tvboxSeal.code;
      (function () {
        var m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash || "");
        if (m) oneTime = lib.key(m[1]);
        if (location.hash) history.replaceState(null, "", location.pathname);
      })();
      function remember() {
        try {
          localStorage.setItem(KEY, JSON.stringify({ id: me.id, key: me.raw, skew: me.skew }));
        } catch (e) {}
      }
      function signed(method, path, body) {
        var url = path + (path.indexOf("?") < 0 ? "?" : "&") + "p=" + me.id + "&ts=" + (Date.now() + me.skew);
        return lib.sign(me.key, method, url, body);
      }

      var setup = document.getElementById("setup"),
        main = document.getElementById("main"),
        msg = document.getElementById("msg"),
        setupMsg = document.getElementById("setup-msg");

      function show(paired) {
        setup.style.display = paired ? "none" : "flex";
        main.style.display = paired ? "flex" : "none";
      }
      function say(el, text, bad) {
        el.textContent = text;
        el.className = bad ? "hint bad" : "hint";
      }

      async function send(url, text) {
        var r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: text,
        });
        var d = null;
        try {
          d = await r.json();
        } catch (e) {}
        return { status: r.status, body: d || {} };
      }
      // A signed request. A refusal for the clock carries the box's time; the
      // page corrects by it and asks once more.
      async function post(path, body) {
        var text = JSON.stringify(body);
        var r = await send(signed("POST", path, text), text);
        if (r.status === 403 && r.body.error === "time" && r.body.now) {
          me.skew = r.body.now - Date.now();
          remember();
          r = await send(signed("POST", path, text), text);
        }
        return r;
      }

      // Pre-filled from the QR, so the usual path is one tap.
      document.getElementById("code").value = fromQr || "";

      document.getElementById("pair").addEventListener("click", async function () {
        var code = document.getElementById("code").value.trim();
        var name = document.getElementById("name").value.trim();
        say(setupMsg, "Pairing…");
        var r;
        var ask = { code: code, name: name };
        try {
          r = await send("/adopt", JSON.stringify(oneTime ? { sealed: lib.seal(oneTime, ask) } : ask));
        } catch (e) {
          return say(setupMsg, "The box did not answer.", true);
        }
        if (r.status === 403) return say(setupMsg, "That code is not the one on the TV.", true);
        var grant = r.body.ok ? (r.body.sealed ? lib.open(oneTime, r.body.sealed) : r.body) : null;
        if (!grant || !grant.id || !lib.key(grant.key))
          return say(setupMsg, "This box cannot pair another phone.", true);
        me = { id: grant.id, key: lib.key(grant.key), raw: grant.key, skew: (grant.now || Date.now()) - Date.now() };
        oneTime = null;
        remember();
        say(setupMsg, "");
        show(true);
        watch();
      });

      var busy = false;
      async function press(action) {
        if (!me || busy) return;
        busy = true; // one in flight: a fast tapper should not queue presses
        try {
          var r = await post("/key", { action: action });
          if (r.status === 403) {
            // The box forgot this phone (or was reset). Say so and ask again,
            // rather than leaving a pad that silently does nothing.
            unpair();
          } else if (!r.body.ok) {
            say(msg, "The box could not send that.", true);
          } else {
            say(msg, "");
          }
        } catch (e) {
          say(msg, "The box did not answer.", true);
        }
        busy = false;
      }

      // pointerdown, not click: a remote should fire when the finger lands.
      document.querySelectorAll("[data-key]").forEach(function (b) {
        b.addEventListener("pointerdown", function (ev) {
          ev.preventDefault();
          if (navigator.vibrate) navigator.vibrate(8);
          press(b.getAttribute("data-key"));
        });
      });

      // The TV's screen, when the box is sharing it. Pull, never a stream: each
      // frame is a request, and a frame costs the box about half a second - so
      // this is "a picture every few seconds", not a mirror. The cache-buster is
      // what stops the browser handing back the previous one.
      var screenBox = document.getElementById("screen"),
        shot = document.getElementById("shot"),
        shotcap = document.getElementById("shotcap"),
        screenTimer = null;
      function stopScreen() {
        if (screenTimer) clearInterval(screenTimer);
        screenTimer = null;
        screenBox.style.display = "none";
        if (shot.src) URL.revokeObjectURL(shot.src);
        shot.removeAttribute("src");
        zoom = 1;
        panX = 0;
        panY = 0;
        shot.style.transform = "";
      }
      // Pinch to zoom, drag to move, double-tap to go back. Written here rather
      // than left to the browser because the page as a whole must NOT zoom - a
      // D-pad that pinches when a thumb slips is worse than no zoom at all.
      var frameBox = document.getElementById("frame"),
        wantWidth = 960, // which size the box is asked for; raised while zoomed in
        zoom = 1,
        panX = 0,
        panY = 0,
        points = new Map(),
        pinchFrom = 0,
        zoomFrom = 1,
        lastTap = 0;
      var MAX_ZOOM = 4;

      function applyZoom() {
        // Clamped so the picture can always be let go of: past 1x it may be moved
        // by its overflow and no further, and at 1x it sits still.
        var r = frameBox.getBoundingClientRect();
        var maxX = Math.max(0, r.width * (zoom - 1));
        var maxY = Math.max(0, r.height * (zoom - 1));
        panX = Math.min(0, Math.max(-maxX, panX));
        panY = Math.min(0, Math.max(-maxY, panY));
        shot.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
        // Above 1x the box is asked for the bigger picture: magnifying a 960-wide
        // JPEG magnifies its artefacts, not the screen.
        wantWidth = zoom > 1.2 ? 1440 : 960;
      }
      function setZoom(next, cx, cy) {
        var before = zoom;
        zoom = Math.min(MAX_ZOOM, Math.max(1, next));
        // Keep whatever is under the fingers under the fingers.
        var k = zoom / before;
        panX = cx - k * (cx - panX);
        panY = cy - k * (cy - panY);
        if (zoom === 1) {
          panX = 0;
          panY = 0;
        }
        applyZoom();
      }
      function pointFrom(ev) {
        var r = frameBox.getBoundingClientRect();
        return { x: ev.clientX - r.left, y: ev.clientY - r.top };
      }
      frameBox.addEventListener("pointerdown", function (ev) {
        frameBox.setPointerCapture(ev.pointerId);
        points.set(ev.pointerId, pointFrom(ev));
        if (points.size === 2) {
          var p = [...points.values()];
          pinchFrom = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
          zoomFrom = zoom;
        } else if (points.size === 1) {
          var now = Date.now();
          if (now - lastTap < 300) {
            var here = pointFrom(ev);
            setZoom(zoom > 1 ? 1 : 2.5, here.x, here.y);
            lastTap = 0;
          } else lastTap = now;
        }
      });
      frameBox.addEventListener("pointermove", function (ev) {
        if (!points.has(ev.pointerId)) return;
        var prev = points.get(ev.pointerId);
        var now = pointFrom(ev);
        points.set(ev.pointerId, now);
        if (points.size === 2) {
          var p = [...points.values()];
          var dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
          if (pinchFrom > 0) {
            var mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
            setZoom(zoomFrom * (dist / pinchFrom), mid.x, mid.y);
          }
        } else if (zoom > 1) {
          panX += now.x - prev.x;
          panY += now.y - prev.y;
          applyZoom();
        }
      });
      function liftPointer(ev) {
        points.delete(ev.pointerId);
        if (points.size < 2) pinchFrom = 0;
      }
      frameBox.addEventListener("pointerup", liftPointer);
      frameBox.addEventListener("pointercancel", liftPointer);

      function startScreen() {
        if (screenTimer || !me) return;
        screenBox.style.display = "flex";
        shotcap.textContent = "Pinch to zoom, double-tap to reset";
        var gone = function () {
          // The box stopped sharing (it runs out on its own), or it could not
          // take a picture. Either way there is nothing to show.
          stopScreen();
          say(msg, "The TV is no longer sharing its screen.");
        };
        // The frame comes back sealed under this phone's key, so it is fetched,
        // opened here and shown from memory.
        var tick = async function () {
          if (document.hidden || !screenTimer) return; // a phone in a pocket should not keep asking
          try {
            var r = await fetch(signed("GET", "/screen?w=" + wantWidth));
            if (!r.ok) return gone();
            var jpeg = lib.openBytes(me.key, new Uint8Array(await r.arrayBuffer()));
            if (!jpeg || !screenTimer) return jpeg ? undefined : gone();
            var old = shot.src;
            shot.src = URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" }));
            if (old) URL.revokeObjectURL(old);
          } catch (e) {
            gone();
          }
        };
        screenTimer = setInterval(tick, 2500);
        tick();
      }

      show(!!me);
      if (retired) say(setupMsg, "Pair this phone again: the box now asks for a new kind of key.", true);

      // Asked repeatedly, not once: the TV is where sharing is turned on, so a
      // page that only looked at startup would sit there showing nothing until
      // somebody thought to reload it. Also how a forgotten phone finds out.
      function watch() {
        if (!me || document.hidden) return;
        post("/ping", {})
          .then(function (r) {
            if (r.status === 403) return unpair();
            if (r.status !== 200) return;
            if (r.body.screen) startScreen();
            else stopScreen();
          })
          .catch(function () {});
      }
      function unpair() {
        try {
          localStorage.removeItem(KEY);
        } catch (e) {}
        me = null;
        stopScreen();
        show(false);
        say(setupMsg, "This phone is no longer paired with the box.", true);
      }
      if (me) watch();
      setInterval(watch, 5000);
    </script>
  </body>
</html>
