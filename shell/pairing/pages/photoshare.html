<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: auto;
        background: #0b0f14;
        color: #f4f6fa;
        font:
          16px/1.5 system-ui,
          sans-serif;
        padding: 24px;
        max-width: 520px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        color: #aab4c2;
        font-size: 14px;
      }
      /* A <label> and a <button> both wear this, and a button also arrives with the
         platform's own border and font. Saying so here is what stops the two
         looking like different controls. */
      .btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        padding: 16px;
        border: 0;
        border-radius: 12px;
        background: #1f6feb;
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        margin-top: 16px;
        -webkit-appearance: none;
        appearance: none;
      }
      .btn.ghost {
        background: #1b2430;
        color: #aab4c2;
        font-size: 15px;
      }
      #st {
        margin-top: 16px;
        text-align: center;
        font-size: 15px;
        color: #7d8a99;
        min-height: 22px;
      }
      #st.bad {
        color: #ff9a9a;
      }
      #count {
        margin-top: 28px;
        text-align: center;
        font-size: 15px;
        color: #aab4c2;
      }
      #count b {
        color: #f4f6fa;
        font-size: 22px;
      }
      input[type="file"] {
        display: none;
      }
      #code {
        display: none;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .cell {
        position: relative;
        aspect-ratio: 1/1;
        border-radius: 10px;
        overflow: hidden;
        background: #161b22;
      }
      .cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .cell button {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: inherit;
        font-size: 16px;
        line-height: 30px;
        padding: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>{{title}}</h1>
    <p>{{hint}}</p>
    <input id="code" />
    <label class="btn" for="f">{{pick}}</label>
    <input id="f" type="file" accept="image/*" multiple />
    <div id="st"></div>
    <div id="count"></div>
    <div id="grid"></div>
    <button class="btn ghost" id="clear" style="display: none">{{clear}}</button>
    <script>
      document.getElementById("code").value = new URLSearchParams(location.search).get("c") || "";
      function code() {
        return document.getElementById("code").value;
      }
      var st = document.getElementById("st"),
        countEl = document.getElementById("count"),
        grid = document.getElementById("grid"),
        clearBtn = document.getElementById("clear");
      function q(p) {
        return p + (p.indexOf("?") < 0 ? "?" : "&") + "c=" + encodeURIComponent(code());
      }
      function say(text, bad) {
        st.textContent = text;
        st.className = bad ? "bad" : "";
      }
      // What the TV is holding, shown back. The pictures are the box's answer, not
      // the phone's memory of what it sent: a second phone can be casting into the
      // same session, and after a reload there is nothing local left to draw.
      async function refresh() {
        try {
          var r = await fetch(q("/pshare-list"));
          var d = await r.json();
          var names = d.names || [];
        } catch (_) {
          return;
        }
        countEl.innerHTML = names.length ? "{{onTv}}: <b>" + names.length + "</b> {{photos}}" : "";
        clearBtn.style.display = names.length ? "" : "none";
        // Redrawn only when the set really changed - otherwise every upload would
        // reload the tiles already on screen.
        var key = names.join("|");
        if (key === grid.dataset.names) return;
        grid.dataset.names = key;
        grid.innerHTML = "";
        names.forEach(function (n) {
          var cell = document.createElement("div");
          cell.className = "cell";
          var img = document.createElement("img");
          // A tile, not the photo: the box renders these small, and the phone is
          // on wifi looking at thirty of them.
          img.src = q("/pshare-img") + "&name=" + encodeURIComponent(n);
          img.loading = "lazy";
          var b = document.createElement("button");
          b.textContent = "✕";
          b.title = "{{del}}";
          b.onclick = async function () {
            try {
              await fetch("/pshare-delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: code(), name: n }),
              });
            } catch (_) {}
            refresh();
          };
          cell.appendChild(img);
          cell.appendChild(b);
          grid.appendChild(cell);
        });
      }
      // The phone does the downscaling: it has the picture in memory already, and
      // a megabyte over wifi is the difference between photos appearing as you
      // pick them and a progress bar. 2560 is above what the TV renders at, so a
      // zoom on the box still has pixels behind it.
      function resize(file) {
        return new Promise(function (res) {
          var img = new Image(),
            url = URL.createObjectURL(file);
          img.onload = function () {
            var m = 2560,
              w = img.width,
              h = img.height;
            if (w > m || h > m) {
              if (w >= h) {
                h = Math.round((h * m) / w);
                w = m;
              } else {
                w = Math.round((w * m) / h);
                h = m;
              }
            }
            var c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            res(c.toDataURL("image/jpeg", 0.85));
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            res(null);
          };
          img.src = url;
        });
      }
      document.getElementById("f").addEventListener("change", async function (e) {
        var files = Array.prototype.slice.call(e.target.files || []),
          ok = 0,
          full = false;
        for (var i = 0; i < files.length && !full; i++) {
          say("{{uploading}} " + (i + 1) + "/" + files.length + "…");
          var data = await resize(files[i]);
          if (!data) continue;
          try {
            var r = await fetch("/pshare" + location.search, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code: code(), name: files[i].name, data: data }),
            });
            if (r.ok) ok++;
            else if (r.status === 507) full = true;
          } catch (_) {}
          // Each photo is shown as it lands rather than at the end: the TV is
          // filling up in front of the person holding the phone.
          refresh();
        }
        e.target.value = "";
        if (full) say("{{full}}", true);
        else if (ok) say(ok + "/" + files.length + " " + "{{done}}");
        else say("{{failed}}", true);
        refresh();
      });
      document.getElementById("clear").addEventListener("click", async function () {
        if (!confirm("{{clearConfirm}}")) return;
        try {
          await fetch("/pshare-clear", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: code() }),
          });
        } catch (_) {}
        say("");
        refresh();
      });
      refresh();
    </script>
  </body>
</html>
